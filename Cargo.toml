[package]
name = "rusty_rdp"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A minimal, dependency-free implementation of the Remote Desktop Protocol (RDP) wire format in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_rdp"
keywords = ["rdp", "remote-desktop", "protocol", "no-deps"]
categories = ["network-programming", "encoding"]

# The default build has ZERO dependencies — the whole point of this crate is a
# std-only RDP codec. The one thing that genuinely cannot be hand-rolled
# responsibly is a TLS stack, so the enhanced-security (TLS) path lives behind
# an opt-in `tls` feature. Everything else, including the RDP-over-TLS protocol
# logic itself, stays in the dependency-free core (it is generic over the
# stream, so you can also bring your own TLS implementation).
#
# `platform` is the one exception to "third-party dependency": it's rustils'
# own hand-rolled OS abstraction layer, not an opaque external crate, so
# taking it behind its own opt-in feature (mirroring `tls`'s shape exactly)
# doesn't compromise the dependency-free ethos the way a real third-party
# networking framework would.
[dependencies]
# Still a direct dependency for the server-side TLS path
# (`accept_tls`/`accept_tls_nla`, `TlsServerStream`) -- rusty_tls has no
# server-side support yet, so that half of this module stays on rustls
# directly. The client-side connectors (`connect_tls`/`connect_tls_with_csprng`/
# the Kerberos variants) no longer touch rustls types themselves; see
# `rusty_tls` below. `default-features = false` + explicit `ring` matches
# `rusty_tls`'s own choice below -- Cargo unifies features across the one
# shared `rustls` build, so leaving this on default features would compile
# in the `aws-lc-rs` provider too, alongside `ring`, for nothing.
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
], optional = true }
# The ecosystem's one shared TLS implementation and trust policy (see its
# own README/ARCHITECTURE.md). Replaces this crate's own hand-built
# `AcceptAnyServerCert` verifier on the client-side connectors with
# `rusty_tls::TrustPolicy::DangerNoVerification` -- the same "don't verify,
# trust is out-of-band" behavior, just named and owned by the crate whose
# whole job is naming trust policies, not reimplemented here. Pinned to a
# specific rev, same convention as `platform` below.
rusty_tls = { git = "https://github.com/baileyrd/rusty_tls", rev = "cb5dbff75b0ebd3056145ebafd293180a9c8d6bd", optional = true }
# Pinned to a specific commit (rustils' PAL group v0.8.0 — CSPRNG,
# Sandbox, and the Net raw-fd/non-blocking escape hatch have all landed
# as of this rev) rather than tracking `main` — a bare SHA carries the
# same guarantee as a tag, per rustils' docs/versioning.md §3, which
# also documents this pinning rule. Bumped from v0.6.0 (05fda987);
# nothing in this crate's own `_with_csprng`/`platform_net` code needed
# anything past v0.6.0, but keeping the pin current avoids drifting
# further behind before the next real need shows up.
platform = { git = "https://github.com/baileyrd/rustils", rev = "5251808971c2e89164d4461c5cf1f45095f60dd3", optional = true }
# Test-only, despite living in [dependencies] rather than
# [dev-dependencies]: Cargo doesn't allow dev-dependencies to be
# optional, so this is the only way to keep it out of the default
# `cargo test` build too, not just the default `cargo build`. Used
# solely by krb5::kdc's own `#[cfg(test)]` module, to exercise
# fetch_tgt_with_csprng/fetch_ap_req_with_csprng against a real (if
# mock) Csprng — never re-exported, never a runtime dependency of the
# shipped library.
platform-mock = { git = "https://github.com/baileyrd/rustils", rev = "5251808971c2e89164d4461c5cf1f45095f60dd3", optional = true }
# Example-only, same reasoning as platform-mock above: `[[example]]`
# targets pull from [dependencies], not [dev-dependencies] (which can't
# be optional), so this is how `examples/serve.rs` gets a concrete
# `Sandbox`/`Net` backend without the core library (or the backend-
# agnostic `platform` feature) ever depending on one. Empty crate on
# non-Linux targets (`#![cfg(target_os = "linux")]` at its root) rather
# than a compile error, so `serve`'s own non-Linux fallback path builds
# cleanly everywhere this pin resolves.
platform-linux = { git = "https://github.com/baileyrd/rustils", rev = "5251808971c2e89164d4461c5cf1f45095f60dd3", optional = true }

[features]
# Enables `tls::connect_tls`, a convenience connector that upgrades the TCP
# stream to TLS with rustls before driving `establish_enhanced`. Off by
# default; enabling it pulls in rustls and its transitive dependencies.
tls = ["dep:rustls", "dep:rusty_tls"]
# Enables `platform_net::PlatformTcpStream`, a std::io::Read+Write adapter
# over any `platform::net::TcpStream` (Linux, Windows, or the mock backend —
# the caller picks). Off by default; enabling it pulls in `platform` itself
# (not a concrete backend crate — the caller adds platform-linux/
# platform-windows/platform-mock separately).
platform = ["dep:platform", "dep:platform-mock"]
# Enables `examples/serve.rs`: a minimal server-mode deployment that binds a
# listener and drives `RdpTransport::accept`, wrapped in optional
# `platform::security::Sandbox` confinement (Landlock filesystem confinement,
# seccomp `block_inet_sockets`). Implies `platform`; additionally pulls in
# the concrete `platform-linux` backend the example needs to actually
# construct a `Sandbox` — kept out of the `platform` feature itself, which
# stays backend-agnostic (see that feature's doc comment above).
serve-example = ["platform", "dep:platform-linux"]

[[example]]
name = "serve"
required-features = ["serve-example"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
